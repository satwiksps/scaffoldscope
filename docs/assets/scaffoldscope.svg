<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">ScaffoldScope</title>
  <desc id="description">A measured coding-agent trajectory inside a scope.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#102d35"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d6ff"/>
      <stop offset="1" stop-color="#80f0b5"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="260" rx="28" fill="url(#background)"/>
  <g transform="translate(42 28)">
    <circle cx="102" cy="102" r="84" fill="none" stroke="#28485b" stroke-width="2"/>
    <circle cx="102" cy="102" r="57" fill="none" stroke="#28485b" stroke-width="2"/>
    <path d="M18 102h168M102 18v168" stroke="#28485b" stroke-width="2"/>
    <path d="M32 133c18-4 27-36 45-36 17 0 24 28 39 28 18 0 21-59 38-59 13 0 18 20 31 23"
          fill="none" stroke="url(#signal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="154" cy="66" r="7" fill="#80f0b5"/>
    <path d="M68 78 46 102l22 24M137 78l22 24-22 24" fill="none" stroke="#d7f7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(255 61)">
    <text x="0" y="63" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="69" font-weight="760" letter-spacing="-2">ScaffoldScope</text>
    <text x="4" y="112" fill="#96b8c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" letter-spacing="1">HOLD THE MODEL STILL. MEASURE THE SCAFFOLD.</text>
  </g>
</svg>
