name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
      - name: Type-check
        run: |
          python -m mypy --platform linux
          python -m mypy --platform win32
          python -m mypy --platform darwin

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: >-
          python -m pytest
          --cov=scaffoldscope
          --cov-report=term-missing
          --cov-fail-under=70
      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.14'
        run: python -m pytest

  coverage:
    name: Upload coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Generate coverage report
        run: >-
          python -m pytest
          --cov=scaffoldscope
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
          --cov-fail-under=70
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          use_oidc: true

  site:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the locked toolchain
        run: npm ci --ignore-scripts
      - name: Validate website source
        run: npm run check
      - name: Build the deployment artifact
        run: npm run build

  package:
    name: Build and inspect distributions
    needs: [quality, tests, coverage, site]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "scaffoldscope/py.typed",
              "scaffoldscope/plugins.py",
              "scaffoldscope/docker_sandbox.py",
              "scaffoldscope/integrity.py",
              "scaffoldscope/locking.py",
              "scaffoldscope/demo/experiment.json",
              "scaffoldscope/demo/tasks.jsonl",
              "scaffoldscope/schemas/experiment.schema.json",
              "scaffoldscope/starter_assets/.gitignore",
              "scaffoldscope/starter_assets/experiment.json",
              "scaffoldscope/starter_assets/tasks.jsonl",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing required files: {sorted(missing)}")
          fixture_roots = {
              "scaffoldscope/demo/fixtures/calculator/",
              "scaffoldscope/demo/fixtures/inventory/",
              "scaffoldscope/demo/fixtures/slug/",
          }
          absent = [root for root in fixture_roots if not any(name.startswith(root) for name in names)]
          if absent:
              raise SystemExit(f"wheel is missing demo fixture trees: {absent}")
          unwanted = [name for name in names if "__pycache__" in name or name.endswith((".pyc", ".pyo"))]
          if unwanted:
              raise SystemExit(f"wheel contains generated bytecode: {unwanted}")

          source_archives = list(Path("dist").glob("*.tar.gz"))
          if len(source_archives) != 1:
              raise SystemExit(f"expected one source archive, found {len(source_archives)}")
          with open_tar(source_archives[0], "r:gz") as archive:
              source_names = archive.getnames()
          included_site_files = [name for name in source_names if "/site/" in name]
          if included_site_files:
              raise SystemExit(
                  "Python source distribution contains website files: "
                  f"{included_site_files[:10]}"
              )
          PY
      - name: Smoke-test the installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          scaffoldscope --version
          scaffoldscope doctor
          scaffoldscope schema --out experiment.schema.json
          scaffoldscope init starter --name wheel-smoke
          scaffoldscope budget starter/experiment.json
          scaffoldscope run starter/experiment.json
          scaffoldscope demo --directory demo
          experiment_dir="$(find starter/runs -mindepth 1 -maxdepth 1 -type d -print -quit)"
          scaffoldscope status "$experiment_dir"
          scaffoldscope check "$experiment_dir"
          scaffoldscope bundle "$experiment_dir" --out evidence.zip
          scaffoldscope verify-bundle evidence.zip
      - name: Smoke-test the example plugin
        run: |
          python -m pip install --no-deps ./examples/plugins/pinned-tail
          scaffoldscope plugins --check
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
